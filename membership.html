<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Membership</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Library Membership Registration</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="books.html">Books</a> |
        <a href="membership.html">Membership</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="contact.html">Contact Us</a>
    </nav>

    <hr>

    <form action="process_membership.php" method="POST">

        <h2>Member Information</h2>

        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <label for="membership_type">Membership Type:</label>

        <select id="membership_type" name="membership_type" required>
            <option value="">Select Membership Type</option>
            <option value="Student">Student</option>
            <option value="Staff">Staff</option>
            <option value="Community Member">Community Member</option>
        </select>

        <br><br>

        <label>Areas of Interest:</label>
        <br>

        <input type="checkbox" id="technology" name="interests[]" value="Technology">
        <label for="technology">Technology</label>

        <input type="checkbox" id="science" name="interests[]" value="Science">
        <label for="science">Science</label>

        <input type="checkbox" id="business" name="interests[]" value="Business">
        <label for="business">Business</label>

        <input type="checkbox" id="literature" name="interests[]" value="Literature">
        <label for="literature">Literature</label>

        <br><br>

        <label for="additional_notes">Additional Notes:</label>
        <br>

        <textarea
            id="additional_notes"
            name="additional_notes"
            rows="5"
            cols="40"></textarea>

        <br><br>

        <label>Membership Duration:</label>
        <br>

        <input
            type="radio"
            id="six_months"
            name="membership_duration"
            value="6 Months"
            required>

        <label for="six_months">6 Months</label>

        <input
            type="radio"
            id="one_year"
            name="membership_duration"
            value="1 Year">

        <label for="one_year">1 Year</label>

        <input
            type="radio"
            id="two_years"
            name="membership_duration"
            value="2 Years">

        <label for="two_years">2 Years</label>

        <br><br>

        <input type="submit" value="Register">

    </form>

    <footer>
        <p>&copy; 2026 Lagos Library</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
